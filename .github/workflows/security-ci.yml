name: MedSecure Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  security-testing:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    env:
      APP_ENV: development

    steps:

      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          values = {
              "SECRET_KEY": secrets.token_hex(32),
              "DEMO_PATIENT_PASSWORD": secrets.token_urlsafe(24),
              "DEMO_NURSE_PASSWORD": secrets.token_urlsafe(24),
              "DEMO_DOCTOR_PASSWORD": secrets.token_urlsafe(24),
              "DEMO_ADMIN_PASSWORD": secrets.token_urlsafe(24),
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY


      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade Python tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install MedSecure dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest bandit pip-audit

      - name: Build and syntax validation
        run: |
          python -m compileall -q app.py tests

      - name: Bandit SAST scan
        run: |
          bandit -r app.py

      - name: Run security regression tests
        run: |
          python -m pytest -v

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt


  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    needs:
      - security-testing
      - secrets-scan

    steps:

      - name: Confirm security checks passed
        run: |
          echo "All MedSecure security checks passed."
          echo "Build is ready for the deployment stage."

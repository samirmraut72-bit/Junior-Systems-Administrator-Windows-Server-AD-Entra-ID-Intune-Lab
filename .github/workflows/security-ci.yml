name: MedSecure Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  security-testing:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-not-for-production
      APP_ENV: development

      DEMO_PATIENT_PASSWORD: Patient123!
      DEMO_NURSE_PASSWORD: Nurse123!
      DEMO_DOCTOR_PASSWORD: Doctor123!
      DEMO_ADMIN_PASSWORD: Admin123!

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade Python tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install MedSecure dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest bandit pip-audit

      - name: Build and syntax validation
        run: |
          python -m compileall -q app.py tests

      - name: Bandit SAST scan
        run: |
          bandit -r app.py

      - name: Run security regression tests
        run: |
          python -m pytest -v

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt


  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    needs:
      - security-testing
      - secrets-scan

    steps:

      - name: Confirm security checks passed
        run: |
          echo "All MedSecure security checks passed."
          echo "Build is ready for the deployment stage."
